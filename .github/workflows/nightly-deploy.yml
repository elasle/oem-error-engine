name: Nightly OEM Generator & GitHub Pages Deploy

on:
  schedule:
    # Runs automatically every night at 03:00 UTC while you sleep
    - cron: '0 3 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Nightly OEM Expansion (on schedule or manual dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "OEMPartDecoder Nightly Bot"
          git config user.email "bot@oempartdecoder.local"
          python3 nightly_generator.py

      - name: Build Static Site (on push)
        if: github.event_name == 'push'
        run: |
          python3 build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
